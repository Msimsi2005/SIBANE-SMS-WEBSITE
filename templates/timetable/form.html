{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6">
  <div class="card">
    <div class="card-header">{{ title }}</div>
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-sm-6"><label class="form-label">Class *</label>{{ form.class_level }}</div>
          <div class="col-sm-6"><label class="form-label">Day *</label>{{ form.day }}</div>
          <div class="col-sm-6"><label class="form-label">Period *</label>{{ form.period }}</div>
          <div class="col-sm-6"><label class="form-label">Subject *</label>{{ form.subject }}</div>
          <div class="col-12"><label class="form-label">Teacher</label>{{ form.teacher }}</div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
          <a href="{% url 'timetable_view' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
