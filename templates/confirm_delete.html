{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header text-danger">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirm Action
      </div>
      <div class="card-body text-center py-4">
        <i class="bi bi-trash3-fill text-danger" style="font-size:3rem"></i>
        <p class="mt-3 mb-4 fs-6">{{ message }}</p>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">
            <i class="bi bi-check-lg me-1"></i>Confirm
          </button>
          <a href="{% url cancel_url %}" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg me-1"></i>Cancel
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
