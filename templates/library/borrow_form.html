{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-6">
  <div class="card">
    <div class="card-header">{{ title }}</div>
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-12"><label class="form-label">Book *</label>{{ form.book }}</div>
          <div class="col-12"><label class="form-label">Student *</label>{{ form.student }}</div>
          <div class="col-sm-6"><label class="form-label">Borrow Date *</label>{{ form.borrow_date }}</div>
          <div class="col-sm-6"><label class="form-label">Due Date *</label>{{ form.due_date }}</div>
          <div class="col-12"><label class="form-label">Notes</label>{{ form.notes }}</div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Confirm Borrow</button>
          <a href="{% url 'borrow_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
