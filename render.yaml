## render.yaml - One-click deploy for Sibane ECD Academy
## Push to GitHub, connect on Render, then click "Deploy".
## Render reads this file and provisions the database + web service automatically.

databases:
  - name: sibane-db
    databaseName: sibane_preschool_db
    user: sibane_admin
    plan: free          # Free Render Postgres currently expires after 30 days.

services:
  - type: web
    name: sibane-preschool
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn sibane_preschool.wsgi --workers 2 --timeout 120 --log-file -"
    healthCheckPath: /health/

    envVars:
      # Database (auto-wired - no copy-paste needed)
      - key: DATABASE_URL
        fromDatabase:
          name: sibane-db
          property: connectionString

      # Django secret (auto-generated)
      - key: SECRET_KEY
        generateValue: true

      # App config
      - key: DEBUG
        value: false

      - key: PYTHON_VERSION
        value: "3.11.7"

      # First admin account. Render will prompt for the password during
      # Blueprint setup, so it is not committed to source control.
      - key: DJANGO_ADMIN_USERNAME
        value: admin

      - key: DJANGO_ADMIN_EMAIL
        value: admin@sibane.zw

      - key: DJANGO_ADMIN_PASSWORD
        sync: false
